<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; background: #fff; color: #111; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; margin: 4px 0; border: 1px solid #222; border-radius: 8px; background: #111; color: #fff; cursor: pointer; font-size: 13px; }
  button.secondary { background: #fff; color: #111; }
  .row { display: flex; gap: 6px; } .row button { flex: 1; }
  textarea { width: 100%; box-sizing: border-box; height: 70px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; padding: 6px; font: inherit; }
  #status { font-size: 12px; color: #b00; min-height: 16px; margin-top: 6px; }
  a { font-size: 12px; color: #555; }
</style>
</head>
<body>
  <h1>🔊 ElevenLabs Page Reader</h1>
  <button id="sel">Read selected text</button>
  <button id="page">Read whole page</button>
  <div class="row">
    <button class="secondary" id="pause">Pause</button>
    <button class="secondary" id="resume">Resume</button>
    <button class="secondary" id="stop">Stop</button>
  </div>
  <textarea id="custom" placeholder="Or type / paste a sentence here..."></textarea>
  <button id="readCustom">Read this text</button>
  <div id="status"></div>
  <a href="#" id="opts">Settings (API key, voice)</a>
  <script src="popup.js"></script>
</body>
</html>
